name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@4

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    
    - name: Build Jar
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker hub
      run: docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER.USERNAME }}/spring-boot-cicd-demo:latest

    - name: Push Image to Docker hub
      run: docker push ${{ secrets.DOCKER.USERNAME }}/spring-boot-cicd-demo:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
         host: ${{secrets.EC2_HOST}}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.SSH_KEY }}
         script: |
            docker stop spring-demo || true
            docker rm spring-demo || true
            delete image spring-demo || true
            docker pull ${{ secrets.DOCKER.USERNAME }}/spring-boot-cicd-demo:latest
            docker run -d --name spring-demo -p 8080:8080 ${{ secrets.DOCKER.USERNAME }}/spring-boot-cicd-demo:latest
            whoami
            ls -al
    
