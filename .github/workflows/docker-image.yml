name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    
    - name: Build Jar
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
            context: .
            push: true
            platforms: linux/amd64
            tags: patelj2600/spring-boot-cicd-demo:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.2.2
      with:
         host: ${{secrets.EC2_HOST}}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.SSH_KEY }}
         script: |
           set -e 
           echo "Stopping old container..."
           
            docker stop spring-demo || true
            docker rm spring-demo || true
           
            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-boot-cicd-demo:latest
           
            echo "Starting new container..."
            docker run -d \ --name spring-demo \ --restart unless-stopped \ -p 8080:8080 \ ${{ secrets.DOCKER_USERNAME }}/spring-boot-cicd-demo:latest
           
            echo "===== Docker PS =====" 
            docker ps
           
            echo "===== Docker PS -A =====" 
            docker ps -a
           
            echo "===== Container Logs =====" 
            docker logs --tail 50 spring-demo
           
            echo "===== Server Info ====="
            whoami
            ls -al
    
